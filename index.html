<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Side-by-side Visualisations</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      display: flex;
      gap: 20px;
      background: #222;
      padding: 20px;
      font-family: sans-serif;
    }

    .viz-box {
      width: 900px;
      height: 900px;
      background: #333;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .vega-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Right-hand PNG */
    #heatmap-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>

<body>

  <!-- LEFT: original full map -->
  <div class="viz-box">
    <div id="earth-vis" class="vega-layer"></div>
  </div>

  <!-- RIGHT: PNG heatmap only -->
  <div class="viz-box">
    <img id="heatmap-img"
         src="https://raw.githubusercontent.com/stirlingp/datavis2/main/luminance_heatmap.png"
         alt="Luminance Heatmap">
  </div>

  <script>
    vegaEmbed('#earth-vis', 'visualisation.json');
  </script>

</body>
</html>
