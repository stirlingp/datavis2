<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Side-by-side Visualisations</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      display: flex;
      gap: 20px;
      background: #222;
      padding: 20px;
      font-family: sans-serif;
    }

    .viz-box {
      position: relative;
      width: 900px;
      height: 900px;
      background: #333;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Right-hand visualisation: PNG behind outline */
    #australia-container {
      background-image: url('https://raw.githubusercontent.com/stirlingp/datavis2/main/luminance_heatmap.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .vega-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <!-- LEFT: Full Earth map -->
  <div class="viz-box">
    <div id="earth-vis" class="vega-layer"></div>
  </div>

  <!-- RIGHT: Australia heatmap -->
  <div class="viz-box" id="australia-container">
    <div id="aus-vis" class="vega-layer"></div>
  </div>

  <script>
    vegaEmbed('#earth-vis', 'earth.json');
    vegaEmbed('#aus-vis', 'australia.json');
  </script>

</body>
</html>
