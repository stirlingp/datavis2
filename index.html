<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GAN Map Visualization</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      background: #bdbdc0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
  </style>
</head>

<body>

<h1>GAN Observations Map</h1>
<div id="vis"></div>

<script>
  vegaEmbed(
    '#vis',
    'https://raw.githubusercontent.com/stirlingp/datavis2/main/visualisation.json'
  );
</script>

</body>
</html>
