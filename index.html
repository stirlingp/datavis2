<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GAN Map Visualization</title>

  <!-- Vega, Vega-Lite, Vega-Embed -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      background: #bdbdc0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
  </style>
</head>

<body>

<h1>GAN Observations Map</h1>
<div id="vis"></div>

<script>
  const spec = {
    "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
    "background": "#bdbdc0",
    "description": "Map of GAN observations colored by Limiting Magnitude",
    "width": 700,
    "height": 900,

    "data": {
      "url": "https://raw.githubusercontent.com/stirlingp/datavis2/main/GaN2025.json",
      "format": {
        "type": "json",
        "parse": {
          "Latitude": "number",
          "Longitude": "number",
          "LimitingMag": "number"
        }
      }
    },

    "transform": [
      {"filter": "isValid(datum.LimitingMag)"}
    ],

    "projection": {"type": "mercator"},

    "layer": [
      {
        "data": {
          "url": "https://vega.github.io/vega-datasets/data/world-110m.json",
          "format": {"type": "topojson", "feature": "countries"}
        },
        "mark": {"type": "geoshape", "fill": "#e0e0e0", "stroke": "white"}
      },
      {
        "mark": {"type": "circle", "size": 80, "opacity": 0.85},
        "encoding": {
          "longitude": {"field": "Longitude", "type": "quantitative"},
          "latitude": {"field": "Latitude", "type": "quantitative"},
          "color": {
            "field": "LimitingMag",
            "type": "quantitative",
            "scale": {
              "scheme": "plasma",
              "domain": [0, 7]
            },
            "title": "Limiting Magnitude"
          },
          "tooltip": [
            {"field": "ID"},
            {"field": "LocalDate"},
            {"field": "LocalTime"},
            {"field": "LimitingMag"},
            {"field": "SQMReading"},
            {"field": "CloudCover"},
            {"field": "Constellation"},
            {"field": "LocationComment"},
            {"field": "Country"}
          ]
        }
      }
    ]
  };

  vegaEmbed('#vis', spec);
</script>

</body>
</html>
