<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Light Pollution</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      background: #222;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .viz-box {
      width: 700px;
      height: 550px;
      background: #333;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>Light Pollution Visualisation</h1>

<div class="viz-box">
  <div id="earth-vis"></div>
</div>

<script>
  vegaEmbed(
    '#earth-vis',
    'https://raw.githubusercontent.com/stirlingp/datavis2/main/visualisation.json',
    { actions: false }
  )
  .then(() => console.log("✅ Loaded"))
  .catch(err => {
    console.error(err);
    alert(err.message);
  });
</script>

</body>
</html>
