<div id="map-container">
  <div id="earth"></div>
</div>

<style>
  #map-container {
    position: relative;
    width: 900px;
    height: 900px;

    /* PNG heatmap BEHIND everything */
    background-image: url('https://raw.githubusercontent.com/stirlingp/datavis2/main/luminance_heatmap.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    /* This ensures the PNG stays behind */
    z-index: 1;
  }

  #earth {
    position: absolute;
    top: 0;
    left: 0;

    /* Vega-Lite map ABOVE the PNG */
    z-index: 2;
  }
</style>

<script>
  vegaEmbed('#earth', 'visualisation.json');
</script>
