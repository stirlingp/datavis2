<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earth + Australia Luminance Heatmap</title>

  <!-- Vega & Vega-Lite -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    #map-container {
      position: relative;
      width: 900px;
      height: 900px;

      /* Your PNG heatmap behind the map */
      background-image: url('https://raw.githubusercontent.com/stirlingp/datavis2/main/luminance_heatmap.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #vis {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>

<body>

  <div id="map-container">
    <div id="vis"></div>
  </div>

  <script>
    vegaEmbed('#vis', 'visualisation.json');
  </script>

</body>
</html>
