<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GAN Map visualisation</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      background: #bdbdc0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .reference {
      margin-top: 20px;
      font-size: 14px;
      color: #333;
    }
    .reference a {
      color: #0044aa;
      text-decoration: none;
    }
  </style>
</head>

<body>

<h1>GAN Observations Map</h1>
<div id="vis"></div>

<div class="reference">
  Data reference: <a href="https://globeatnight.org/maps-data/" target="_blank">
    Globe at Night – Maps & Data
  </a>
</div>

<script>
  vegaEmbed(
    '#vis',
    'https://raw.githubusercontent.com/stirlingp/datavis2/main/visualisation.json'
  );
</script>

</body>
</html>
